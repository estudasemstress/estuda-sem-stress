<style>
/* Layout: estojo branco; cada caderno é um bloco pastel. Coluna central estreita, barra superior com navegação. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F6F5FA; --ink:#2A2840; --muted:#6E6A86; --line:#E6E3F0;
  --accent:#6C5BB0; --accent-soft:#EFEBFB; --ok:#2C7563; --ok-soft:#D6F0E8; --ok-bar:#A6DCCB; --rev:#A0566A; --rev-soft:#F7E3E8; --rev-bar:#EDC0CC;
  --warn-soft:#FFF4D2; --warn:#7A5C10;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --shadow:0 2px 12px rgba(40,36,80,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17161F; --surface:#1F1E2A; --soft:#262534; --ink:#ECEAF6; --muted:#A6A2C0; --line:#353447;
  --accent:#B7A8F0; --accent-soft:#2D2A45; --ok:#8FDCC2; --ok-soft:#1F3A33; --ok-bar:#3F7A68; --rev:#F0A8BC; --rev-soft:#3E2630; --rev-bar:#8A4C5E;
  --warn-soft:#3A3220; --warn:#F0D58A; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17161F; --surface:#1F1E2A; --soft:#262534; --ink:#ECEAF6; --muted:#A6A2C0; --line:#353447;
  --accent:#B7A8F0; --accent-soft:#2D2A45; --ok:#8FDCC2; --ok-soft:#1F3A33; --ok-bar:#3F7A68; --rev:#F0A8BC; --rev-soft:#3E2630; --rev-bar:#8A4C5E;
  --warn-soft:#3A3220; --warn:#F0D58A; --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.brand span{font-size:.8rem;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:.9rem}
.btn.pri{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--rev);border-color:var(--rev-soft)}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{background:none;border:0;color:var(--accent);padding:0;font-weight:700}
.panel{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface)}
.panel h3{font-size:1.05rem;margin-bottom:8px}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px;min-width:0}
input[type=text],input[type=search],input[type=date],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-width:0}
.hero{display:grid;gap:4px;padding:22px 4px 6px;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;color:var(--accent)}
.hero p{margin:0;color:var(--muted)}
/* contagem */
.exams{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:12px;padding:8px 12px}
.ex .d{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:center}
.ex .n{font-weight:700}
.ex small{display:block;color:var(--muted);font-weight:400}
.ex .g{font-size:.82rem;text-align:right}
/* pastas e cadernos */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.nb{position:relative;border-radius:14px;padding:14px 14px 12px;min-height:128px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;color:#2A2840}
.nb::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:5px;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.08) 0 6px,transparent 6px 14px);border-radius:3px}
.nb b{font-family:var(--display);font-size:1.1rem;padding-left:10px;line-height:1.15}
.nb span{font-size:.8rem;padding-left:10px;opacity:.8}
.nb .meter{margin-top:auto;margin-left:10px;height:6px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;display:flex}
.nb .meter i{display:block;height:100%}
.nb.add{background:var(--soft);color:var(--muted);border:1.5px dashed var(--line);align-items:center;justify-content:center;font-weight:700}
.nb.add::before{display:none}
.fold{display:flex;flex-direction:column;gap:10px}
.fold>header{display:flex;align-items:center;gap:8px}
.fold>header h2{font-size:1.15rem}
.fold>header .dot{width:12px;height:12px;border-radius:4px}
/* separadores */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
/* cartão */
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.82rem;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.rev{background:var(--rev-soft);color:var(--rev)} .pill.todo{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.card{border-radius:18px;min-height:300px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;color:#2A2840;box-shadow:var(--shadow)}
.card .tag{display:flex;gap:8px;align-items:center;font-size:.78rem;opacity:.85;flex-wrap:wrap}
.card .tag b{background:rgba(255,255,255,.75);border-radius:6px;padding:1px 7px}
.card .front{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.15;padding:10px}
.card .hint{text-align:center;font-size:.8rem;opacity:.7}
.card .ans{font-size:1rem}
.card .ans h2{font-size:1.2rem;margin-bottom:6px}
.box{background:rgba(255,255,255,.78);border-radius:10px;padding:8px 11px;font-size:.92rem}
.box b{display:block;font-size:.85rem}
.src{align-self:flex-end;background:rgba(255,255,255,.8);border:0;border-radius:99px;padding:4px 11px;font-size:.82rem;font-weight:700;color:#2A2840}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate button{border:0;border-radius:12px;padding:12px;font-weight:700;font-size:1rem}
.b-r{background:var(--rev-soft);color:var(--rev)} .b-s{background:var(--ok-soft);color:var(--ok)}
.rate .on{outline:2px solid currentColor}
.nav{display:flex;justify-content:space-between;align-items:center}
.count{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.answer{display:flex;flex-direction:column;gap:8px}
.answer textarea{min-height:80px;width:100%}
.res{border-radius:12px;padding:10px 12px;font-size:.93rem}
.res.certo{background:var(--ok-soft)} .res.quase{background:var(--warn-soft)} .res.errado{background:var(--rev-soft)}
/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.li .grow{display:flex;flex-direction:column;gap:2px}
.li b{font-size:.95rem}
.li .muted{overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.75rem;border-radius:99px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);background:var(--soft)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* editor tipo Word */
.rte{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--soft);align-items:center}
.tb button,.tb select,.tb label{border:1px solid transparent;background:none;border-radius:7px;min-width:30px;height:30px;padding:0 6px;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.tb button:hover,.tb label:hover{background:var(--surface);border-color:var(--line)}
.tb select{border-color:var(--line);background:var(--surface);height:30px;font-size:.82rem;padding:0 4px}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb label{position:relative;cursor:pointer}
.tb label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tb label i{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px}
.ed{min-height:140px;padding:12px 14px;outline:none;font-size:1rem;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.rich ul,.rich ol,.ed ul,.ed ol{padding-left:22px;margin:4px 0}
.rich p,.ed p{margin:0 0 6px}
.rich h3{font-size:1rem;margin:10px 0 4px;color:var(--accent)}
.note{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.note h3{margin-bottom:6px}
.dialog{position:fixed;inset:0;background:rgba(20,18,40,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog .panel{width:min(560px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.pagebox{white-space:pre-wrap;font-size:.92rem;background:var(--soft);border-radius:10px;padding:10px 12px;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;z-index:60}
.ex-tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 7px}
/* IA, guia, comunidade */
.ia{border-color:var(--accent-soft);background:var(--accent-soft);color:var(--accent);font-weight:700}
.ia.zero{background:var(--rev-soft);border-color:var(--rev-soft);color:var(--rev)}
.slogan{font-family:var(--display);font-weight:800;color:var(--ink);font-size:1.05rem}
.tour{gap:14px!important}
.tour .num{font-family:var(--display);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tour h3{font-size:1.45rem!important}
.tour .ill{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;color:#2A2840}
.tour .ill ol,.tour .ill ul{margin:0;padding-left:20px}
.tour .dots{display:flex;gap:5px;justify-content:center}
.tour .dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.tour .dots i.on{background:var(--accent);width:20px}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:.92rem}
.lock.pub{background:var(--accent-soft);color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1 1 240px;font-size:.85rem}
.iabar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px 16px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;background:var(--surface)}
.iabar .m{display:flex;flex-direction:column;gap:4px;min-width:0}
.iabar .m span{font-size:.82rem;color:var(--muted)}
.iabar .m b{color:var(--ink)}
.iabar .dots2{display:flex;flex-wrap:wrap;gap:3px;min-height:8px;align-items:center}
.iabar .dots2 i{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.iabar .dots2 em{font-size:.72rem;font-style:normal;color:var(--muted)}
.iabar .t{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.iabar .t i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.iabar .t i.hi{background:var(--rev-bar)}
.iabar small{font-size:.78rem;color:var(--muted);white-space:nowrap}
@media (max-width:560px){ .iabar{grid-template-columns:1fr 1fr} .iabar small{grid-column:1/-1;white-space:normal} }
.by{font-size:.78rem!important;opacity:.75}
/* caderno com o tema da disciplina (como as aplicações de flashcards) */
.st{--tink:var(--th-aink);--tmuted:var(--th-muted);--tline:var(--th-line);--tsoft:var(--th-soft);--tacc:var(--th-acc);--tdeep:var(--th-ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .st{--tink:var(--accent);--tmuted:var(--muted);--tline:var(--line);--tsoft:var(--accent-soft);--tacc:var(--accent-soft);--tdeep:var(--ink)} }
:root[data-theme="dark"] .st{--tink:var(--accent);--tmuted:var(--muted);--tline:var(--line);--tsoft:var(--accent-soft);--tacc:var(--accent-soft);--tdeep:var(--ink)}
.st .crumbs button{color:var(--tink)}
.nbhead{position:relative;border:1.5px solid var(--tline);border-radius:22px;padding:24px 20px 22px;text-align:center;background:var(--surface)}
.nbhead .eyebrow{margin:0 0 8px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tmuted);font-weight:700}
.nbhead h1{font-size:clamp(2rem,6.5vw,3rem);font-weight:800;color:var(--tink);letter-spacing:-.015em;line-height:1.05}
.nbhead .edit{position:absolute;top:10px;right:10px;border-color:var(--tline);color:var(--tink)}
.st .pill.todo{background:var(--surface);color:var(--tink);box-shadow:inset 0 0 0 1.5px var(--tline)}
.st .pill.fire{background:var(--warn-soft);color:var(--warn)}
.st .bar{background:var(--tline)}
.st .tabs{border-color:var(--tline)}
.st .tabs button[aria-selected="true"]{color:var(--tink);border-color:var(--tink)}
.st .panel{border-color:var(--tline)}
.st .btn{border-color:var(--tline)}
.st .btn.pri{border-color:var(--tink);color:var(--tink)}
.st .btn.fill{background:var(--tink);border-color:var(--tink);color:var(--bg)}
.st .seg{border-color:var(--tline)}
.st .seg button[aria-pressed="true"]{background:var(--surface);color:var(--tink);box-shadow:inset 0 0 0 1.5px var(--tink)}
.st .tog[aria-pressed="true"]{border-color:var(--tink);color:var(--tink);font-weight:700;background:var(--tsoft)}
.st select,.st input[type=search],.st input[type=text],.st textarea{border-color:var(--tline)}
.cd h3{font-size:1.15rem;color:var(--tink);margin-bottom:8px}
.cd h3 .big{font-size:1.6rem}
.cd p{margin:6px 0}
.cdrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cdrow .bar{min-width:120px}
.det{border:1.5px solid var(--tline);border-radius:16px;padding:0 16px;background:var(--surface)}
.det summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:700;color:var(--tink);display:flex;justify-content:space-between;align-items:center}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:"▾";font-size:.9rem;transition:transform .2s}
.det[open] summary::after{transform:rotate(180deg)}
.det[open]{padding-bottom:14px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;background:var(--soft);border-radius:12px;padding:9px 12px;text-align:left}
.mrow .mn{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem;min-width:0}
.mrow .mn b{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;font-size:.78rem;color:#2A2840}
.mrow .mc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .bar{grid-column:1/-1;height:6px}
.gen{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.gen div{background:var(--tsoft);border-radius:12px;padding:9px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.gen b{color:var(--tink)}
.det h4{margin:6px 0 8px;font-family:var(--display);color:var(--tink)}
.mt{border-radius:12px;padding:10px 14px;margin-bottom:8px;color:#2A2840;font-size:.92rem}
.mt ul{margin:6px 0 0;padding-left:20px}
.az{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 4px}
.az button{border:1px solid var(--tline);background:var(--surface);border-radius:7px;min-width:28px;height:28px;font-size:.78rem;padding:0 6px}
.az button[aria-pressed="true"]{background:var(--tink);color:var(--bg);border-color:var(--tink)}
.az button:disabled{opacity:.3}
.dl{margin:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.dl div{border-bottom:1px solid var(--line);padding:6px 2px}
.dl dt{font-weight:700;color:var(--tink)}
.dl dd{margin:0;font-size:.9rem}
.controls{display:flex;flex-direction:column;gap:10px}
.controls select{flex:1 1 220px} .controls input[type=search]{flex:1 1 160px}
.stage{perspective:1400px}
.c3{position:relative;width:100%;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:18px}

<script>
"use strict";
// ---------- utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysTo = s => Math.round((parseD(s) - today0()) / 86400000);
const fmtD = s => { const [y,m,d] = s.split("-"); return d+"/"+m; };
const PAL = [["#DCEEFC","#B7D9F5"],["#F7E3E8","#EDC0CC"],["#D6F0E8","#A6DCCB"],["#EFE8FB","#D6C9F2"],["#FFF1D6","#F2D9A6"],["#FCE5EE","#F3C1D5"],["#E3F3F3","#B9E3E3"],["#FCEAE1","#F2C9B6"],["#E8EEFC","#C9D3F2"],["#EEF6E0","#D3E8B5"]];
function toast(msg){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function plain(html){ const d = document.createElement("div"); d.innerHTML = sanitize(html); return d.textContent || ""; }

// ---------- HTML seguro (editor tipo Word)
const OK_TAGS = new Set(["B","STRONG","I","EM","U","S","STRIKE","SUB","SUP","SPAN","FONT","P","DIV","BR","UL","OL","LI","MARK","H1","H2","H3","BLOCKQUOTE"]);
const OK_CSS = ["color","background-color","font-size","text-align","font-family","font-weight","font-style","text-decoration"];
function sanitize(html){
  const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
  const walk = el => {
    [...el.childNodes].forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || !OK_TAGS.has(n.tagName)) { if (n.nodeType === 1 && !["SCRIPT","STYLE","IFRAME","OBJECT"].includes(n.tagName)) { walk(n); n.replaceWith(...n.childNodes); } else n.remove(); return; }
      [...n.attributes].forEach(a => {
        const k = a.name.toLowerCase();
        if (k === "style") { const keep = []; n.style && OK_CSS.forEach(p => { const v = n.style.getPropertyValue(p); if (v && !/url|expression/i.test(v)) keep.push(p+":"+v); }); keep.length ? n.setAttribute("style", keep.join(";")) : n.removeAttribute("style"); }
        else if (n.tagName === "FONT" && ["color","size","face"].includes(k)) {}
        else n.removeAttribute(a.name);
      });
      walk(n);
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}
const rich = s => /<[a-z][\s\S]*>/i.test(s || "") ? sanitize(s) : esc(s).replace(/\n/g, "<br>");

// Gerador de flashcards SEM IA: regras simples sobre o texto de cada página.
function autoCards(pages, opt){
  opt = opt || {};
  const per = opt.per || 5;
  const norm = s => String(s || "").replace(/[\s ]+/g, " ").trim();
  const key = l => norm(l).toLowerCase().replace(/\d+/g, "#");
  const BUL = "•▪◦·\\-–—*§✓✔➢➤►▶●■□❖◆◇○\\uF000-\\uF8FF";
  const bulRe = new RegExp("^[\\s" + BUL + "]+");
  const numRe = /^(\d{1,2}|[a-z])[.)](?!\d)\s*(?=\S)/i;
  const isGlyph = l => bulRe.test(l);
  const isBullet = l => isGlyph(l) || numRe.test(l);
  const strip = s => s.replace(bulRe, "").replace(numRe, "").trim();
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const words = s => s.split(/\s+/).filter(Boolean).length;

  // 1) mobília: linhas que aparecem em muitas páginas (data, nome da disciplina, «Professor 12»)
  const n = pages.length, cnt = {};
  pages.forEach(p => new Set(String(p).split("\n").map(key).filter(Boolean)).forEach(k => cnt[k] = (cnt[k] || 0) + 1));
  const furn = k => n >= 4 && cnt[k] >= Math.max(3, Math.ceil(n * 0.6));
  const junk = l => /^[\d\s./-]{1,12}$/.test(l) || /https?:\/\/|www\.|youtu/i.test(l) || /\S+@\S+\.\S+/.test(l) || l.length < 2;
  const COVER = l => /\S+@\S+\.\S+/.test(l) || /^(prof(\.|essor|essora)?|docente|regente|assistente|mestre|doutor[a]?|dr\.?|dra\.?)(\s|$)/i.test(l) || /\b\d+\s*[ºª.]?\s*aula\b/i.test(l) || /^(curso|unidade curricular|uc|ano letivo|ano lectivo|semestre)\b/i.test(l);
  const ADMIN = /^(sum[aá]rio|[ií]ndice|conte[uú]dos?( program[aá]ticos?)?|plano da aula|objetivos?( da aula| de aprendizagem)?|objectivos?( da aula)?|agenda|bibliografia|refer[eê]ncias( bibliogr[aá]ficas)?|webgrafia|quest[oõ]es\s*\/?\s*d[uú]vidas|quest[oõ]es\??|d[uú]vidas\??|perguntas\??|obrigad[oa].*|fim|the end|thank you.*|summary|outline|contents)$/i;

  // 2) dividir cada página em slides (folhetos com 2 ou mais slides por página) e limpar
  const segs = [];
  pages.forEach((txt, i) => {
    let cur = [];
    const flush = () => { if (cur.length) segs.push({pg: i + 1, raw: cur}); cur = []; };
    String(txt || "").split("\n").forEach(l0 => {
      const l = norm(l0); if (!l) return;
      const k = key(l);
      if (furn(k)) { if (/#/.test(k) && words(l) <= 5) flush(); return; }
      if (junk(l)) return;
      cur.push(l);
    });
    flush();
  });
  segs.forEach((s, si) => {
    // capa: nas primeiras partes do documento, com email/professor/«5.ª aula»
    if (si < 3 && s.raw.filter(COVER).length >= 1 && s.raw.filter(COVER).length + 2 >= Math.min(4, s.raw.length * .3)) { const firstAdmin = s.raw.findIndex(l => ADMIN.test(l.replace(/[:.]$/, ""))); s.skip = true; return; }
    const a = s.raw.findIndex(l => ADMIN.test(strip(l).replace(/[:.!]$/, "")));
    if (a >= 0) s.raw = s.raw.slice(0, a);
    s.raw = s.raw.filter(l => !COVER(l));
    // juntar linhas partidas
    const lines = [];
    s.raw.forEach(l => { const prev = lines[lines.length - 1];
      if (prev && /^[a-zà-ú(“"]/.test(l) && !isBullet(l) && !/[.;:!?]$/.test(prev)) lines[lines.length - 1] = prev + " " + l; else lines.push(l); });
    s.lines = lines;
    // títulos no topo do slide
    const heads = []; let k = 0;
    while (k < lines.length && heads.length < 4) { const l = lines[k];
      if (/[.:;,?!]$/.test(l) || l.length > 110 || /[+=→➜]/.test(l)) break;
      if (isGlyph(l)) { const g = l.trim()[0], nx = lines[k+1] || ""; if (words(strip(l)) > 6 || !nx || (isGlyph(nx) && nx.trim()[0] === g)) break; }
      const w = words(l), numbered = /^\d{1,2}(\.\d)*[.)]?\s/.test(l);
      if (w > (numbered ? 14 : 8)) break;
      if (!numbered && w > 3 && /^(o|a|os|as|um|uma|no|na|nos|nas|em|para|caso|se|é|são|existem?|quando|apenas|tal|este|esta|isto|the|a|an)\s/i.test(l)) break;
      heads.push(strip(l).replace(/^\d{1,2}(\.\d)*[.)]?\s+/, "")); k++; }
    s.heads = heads; s.body = lines.slice(k);
  });
  if (opt.segsOnly) return segs;
  const topicCount = {};
  segs.forEach(s => { if (!s.skip && s.heads.length) { const t = s.heads[s.heads.length - 1].toLowerCase(); topicCount[t] = (topicCount[t] || 0) + 1; } });

  const out = [], seen = new Set();
  const add = (f, r, pg, kind) => { f = norm(f); r = String(r).split("\n").map(norm).filter(Boolean).join("\n").trim();
    if (f.length < 3 || r.length < 3 || f.toLowerCase() === r.toLowerCase()) return false; const kk = f.toLowerCase(); if (seen.has(kk)) return false; seen.add(kk); out.push({f, r, pg, kind}); return true; };
  const art = t => { const w = t.split(" ")[0], lw = w.toLowerCase();
    const low = /^[A-ZÀ-Ú]{2,}/.test(w) ? t : t.charAt(0).toLowerCase() + t.slice(1);
    if (/(ção|são|dade|gem|ase|ite|ose|ia|ura|ina|eira|a)$/.test(lw)) return "a " + low;
    if (/(ções|sões|dades|agens|as)$/.test(lw)) return "as " + low;
    if (/(os|es|is)$/.test(lw)) return "os " + low;
    if (/(o|or|ismo|ento|e|l|r|z)$/.test(lw)) return "o " + low;
    return low; };
  const makeQ = (lead, topic) => {
    let l = lead.replace(/:\s*$/, "").trim();
    if (/\?$/.test(l)) return l;
    const m = l.match(/^existem?\s+(\d+|v[aá]ri[ao]s|diversos|diversas|dois|duas|tr[eê]s|quatro|cinco|seis)\s+(\S+)(.*)$/i);
    if (m) { const g = /as$/i.test(m[2]) ? "as" : "os"; return `Quais são ${/^\d/.test(m[1]) ? g + " " + m[1] : "as"} ${m[2]}${m[3]}?`.replace(/\s+\?/, "?"); }
    if (/^(quais|qual|quando|como|porqu|onde|o que|quem)/i.test(l)) return cap(l) + "?";
    if (topic && !l.toLowerCase().includes(topic.toLowerCase())) { const f = `${topic}: ${l.charAt(0).toLowerCase() + l.slice(1)}`; return f.length <= 150 ? f : l; }
    return l; };
  const VERB = /^(.{3,70}?)\s+(é|são|consiste em|consistem em|corresponde a|correspondem a|define-se como|definem-se como|designa-se|designam-se|significa|significam|refere-se a|chama-se|chamam-se|visa|visam|tem por objetivo|têm por objetivo|tem como objetivo|caracteriza-se por|caracterizam-se por|is|are|means|refers to)\s+(.{8,})$/i;
  const BAD_SUBJ = /^(isto|isso|este|esta|estes|estas|ele|ela|eles|elas|o que|que|it|this|there|which|não|também|assim|ou seja|neste sentido|contudo|apesar|processo|conjunto|parte|forma|caso)\b|pel[oa] qual|n[oa] qual|em que/i;
  const DEFN = /^(processo|conjunto|capacidade|fase|mecanismo|parte|quantidade|forma|modo|m[eé]todo|t[eé]cnica|estudo|ci[eê]ncia|ramo|medida|subst[aâ]ncia|estado|situa[cç][aã]o|condi[cç][aã]o|les[aã]o|doen[cç]a|altera[cç][aã]o|c[eé]lulas?|tecido|[oó]rg[aã]o|via|propriedade|fra[cç][cç]?[aã]o|grupo|tipo|sistema|disciplina|a[cç][aã]o|capacidade|transporte|movimento|liga[cç][aã]o|entrada|sa[ií]da|elimina[cç][aã]o|transforma[cç][aã]o)\b/i;

  segs.forEach(s => {

// sincronização pessoal (telemóvel e computador) quando a conta o permite
async function syncDown(){
  try {
    const snap = await CAP.db.collection("data/users/" + CAP.uid).get();
    let changed = false; const docsText = {};
    const gxs = {};
    snap.docs.forEach(d => { const v = thaw(d.data()); if (d.id.startsWith("dc-")) docsText[d.id.slice(3)] = v; if (d.id.startsWith("gx-")) gxs[d.id.slice(3)] = v; });
    snap.docs.forEach(d => {
      const v = thaw(d.data()); if (!v) return;
      if (d.id === "quota"){ const q = iaQ(); if (v.d === q.d) { q.criar = Math.max(q.criar||0, v.criar||0); q.corrigir = Math.max(q.corrigir||0, v.corrigir||0); } }
      else if (d.id === "meta"){ if (v.alias != null && S.alias == null) S.alias = v.alias; if ((v.updated||0) > (S.metaUpdated||0)) { S.folders = v.folders || S.folders; S.metaUpdated = v.updated; changed = true; } }
      else if (d.id.startsWith("nb-")){
        const nb = v.nb; if (!nb) return; const mine = S.notebooks.find(x => x.id === nb.id);
        const gx = gxs[nb.id]; if (gx) { if (gx.glo) nb.glo = gx.glo; if (gx.trk) nb.trk = gx.trk; if (gx.cases) nb.cases = gx.cases; }
        (nb.docs||[]).forEach(dc => { const t = docsText[dc.id]; if (t && t.pages) dc.pages = t.pages; });
        if (!mine) { S.notebooks.push(nb); changed = true; }
        else if ((nb.updated||0) > (mine.updated||0)) { (nb.docs||[]).forEach(dc => { if (!dc.pages) { const o = (mine.docs||[]).find(x=>x.id===dc.id); if (o) dc.pages = o.pages; } }); Object.assign(mine, nb); changed = true; }
      }
    });
    if (changed) { try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
  } catch(e) { CAP.canWrite = false; }
}
async function syncUp(){
  if (!CAP.canWrite) return;
  const col = CAP.db.collection("data/users/" + CAP.uid);
  try {
    await col.doc("meta").set({folders: S.folders, alias: S.alias || "", updated: S.metaUpdated = Date.now()});
    for (const nb of S.notebooks){
      if (nb.example) continue;
      if ((nb.synced||0) >= (nb.updated||0)) continue;
      const light = JSON.parse(JSON.stringify(nb)); (light.docs||[]).forEach(d => delete d.pages); delete light.synced;
      const gx = {glo: light.glo || null, trk: light.trk || null, cases: light.cases || null}; delete light.glo; delete light.trk; delete light.cases;
      if (gx.glo || gx.trk || gx.cases) await col.doc("gx-" + nb.id).set(gx);
      if (JSON.stringify(light).length < 900000) await col.doc("nb-" + nb.id).set({nb: light});
      for (const d of nb.docs || []) { if (d.synced) continue; let pages = d.pages || []; let s = JSON.stringify(pages);
        while (s.length > 240000 && pages.length) { pages = pages.map(p => p.slice(0, Math.floor(p.length * .8))); s = JSON.stringify(pages); }
        await col.doc("dc-" + d.id).set({pages}); d.synced = 1; }
      nb.synced = Date.now();
    }
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  } catch(e) { if (e && e.code === "invalid_argument") CAP.canWrite = false; }
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files){ // [{name, data: Uint8Array}]
  const te = new TextEncoder(), parts = [], central = []; let off = 0;
  const u16 = v => [v & 255, v >> 8 & 255], u32 = v => [v & 255, v >> 8 & 255, v >> 16 & 255, v >>> 24 & 255];
  files.forEach(f => { const nm = te.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const head = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    parts.push(head, nm, f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += head.length + nm.length + sz; });
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  const all = parts.concat(central, [end]), out = new Uint8Array(all.reduce((s, p) => s + p.length, 0)); let p = 0; all.forEach(a => { out.set(a, p); p += a.length; }); return out;
}
const xesc = s => String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const hx = c => String(c || "").replace("#", "").toUpperCase();
function wRun(text, o){ o = o || {}; const pr = `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b ? "<w:b/>" : ""}${o.i ? "<w:i/>" : ""}${o.color ? `<w:color w:val="${hx(o.color)}"/>` : ""}<w:sz w:val="${Math.round((o.size || 11) * 2)}"/></w:rPr>`;
  return String(text).split("\n").map((l, k) => `${k ? "<w:r><w:br/></w:r>" : ""}<w:r>${pr}<w:t xml:space="preserve">${xesc(l)}</w:t></w:r>`).join(""); }
function wPara(runs, o){ o = o || {}; return `<w:p><w:pPr>${o.shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${hx(o.shade)}"/>` : ""}${o.bar ? `<w:pBdr><w:left w:val="single" w:sz="24" w:space="8" w:color="${hx(o.bar)}"/></w:pBdr>` : ""}<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 80 : o.after}"/>${o.center ? '<w:jc w:val="center"/>' : ""}${o.keep ? "<w:keepNext/>" : ""}</w:pPr>${runs}</w:p>`; }
function flashDocx(o){
  const INK = "2A2840", MUT = "6E6A86"; let body = "";
  body += wPara(wRun(o.eyebrow.toUpperCase(), {b: 1, size: 8.5, color: MUT}), {after: 40});
  body += wPara(wRun(o.title, {b: 1, size: 26, color: o.ink}), {after: 60});
  body += wPara(wRun(`${o.cards.length} flashcards · ${o.date}`, {size: 10, color: MUT}), {after: 240});
  if (o.mode === "ler") {
    let last = null;
    o.cards.forEach(c => {
      if (c.mod !== last) { last = c.mod; body += wPara(wRun(c.mod, {b: 1, size: 12, color: INK}), {shade: c.col[0], bar: c.col[1], before: 200, after: 120, keep: 1}); }
      const bar = c.col[1];
      body += wPara(wRun((c.num ? c.num + "  " : "") + plainTxt(c.f), {b: 1, size: 11.5, color: INK}), {bar, before: 120, after: 40, keep: 1});
      body += wPara(wRun(plainTxt(c.r), {size: 10.5, color: INK}), {bar, after: 40});
      if (c.pt) body += wPara(wRun("🇵🇹 " + c.pt, {i: 1, size: 10, color: INK}), {bar, after: 40});
      if (plainTxt(c.p)) body += wPara(wRun("💬 Porquê? ", {b: 1, size: 10, color: o.ink}) + wRun(plainTxt(c.p), {size: 10, color: "4A4560"}), {bar, after: 40});
      if (c.x) body += wPara(wRun("➕ Extra: ", {b: 1, size: 10, color: o.ink}) + wRun(c.x, {size: 10, color: "4A4560"}), {bar, after: 40});
      if (c.n) body += wPara(wRun("⚠ " + c.n, {b: 1, size: 10, color: "7A5C10"}), {bar, after: 40});
      if (plainTxt(c.d)) body += wPara(wRun("💡 " + plainTxt(c.d), {b: 1, size: 10, color: "4A4560"}), {bar, after: 40});
      if (c.src) body += wPara(wRun("📖 " + c.src, {size: 8.5, color: MUT}), {bar, after: 80});
    });
  } else {
    body += wPara(wRun("Recorta pelas linhas: cada linha da tabela é um cartão (pergunta à esquerda, resposta à direita). Dobra ao meio pela linha do centro.", {i: 1, size: 9, color: MUT}), {after: 160});
    const cell = (inner, fill, w) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${hx(fill)}"/>` : ""}<w:tcMar><w:top w:w="140" w:type="dxa"/><w:left w:w="160" w:type="dxa"/><w:bottom w:w="140" w:type="dxa"/><w:right w:w="160" w:type="dxa"/></w:tcMar><w:vAlign w:val="center"/></w:tcPr>${inner}</w:tc>`;
    const b = 'w:val="dashed" w:sz="6" w:space="0" w:color="A8A2C0"';
    body += `<w:tbl><w:tblPr><w:tblW w:w="9638" w:type="dxa"/><w:tblBorders><w:top ${b}/><w:left ${b}/><w:bottom ${b}/><w:right ${b}/><w:insideH ${b}/><w:insideV ${b}/></w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4819"/><w:gridCol w:w="4819"/></w:tblGrid>`
      + o.cards.map(c => `<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="2200"/></w:trPr>${cell(wPara(wRun((c.num ? c.num + " · " : "") + c.mod, {size: 7.5, color: MUT}), {after: 120}) + wPara(wRun(plainTxt(c.f), {b: 1, size: 13, color: INK}), {center: 1, after: 0}), c.col[0], 4819)}${cell(
          wPara(wRun(plainTxt(c.r), {size: 10, color: INK}), {after: 60}) + (plainTxt(c.d) ? wPara(wRun("💡 " + plainTxt(c.d), {b: 1, size: 9, color: "4A4560"}), {after: 60}) : "") + (c.src ? wPara(wRun("📖 " + c.src, {size: 8, color: MUT}), {after: 0}) : ""), null, 4819)}</w:tr>`).join("") + `</w:tbl>`;
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const te = new TextEncoder();
  return zipStore([
    {name: "[Content_Types].xml", data: te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')},
    {name: "_rels/.rels", data: te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')},
    {name: "word/document.xml", data: te.encode(doc)}]);
}

function parseCards(txt){ // aceita JSON [{f,r,...}] ou linhas «Pergunta || Resposta || página»
  txt = String(txt || ""); const out = [];
  const m = txt.match(/\[[\s\S]*\]/);
  if (m) { try { const a = JSON.parse(m[0]); if (Array.isArray(a)) a.forEach(x => { if (x && (x.f || x.pergunta) && (x.r || x.resposta)) out.push({f: String(x.f || x.pergunta), r: String(x.r || x.resposta), p: String(x.p || x.porque || ""), d: String(x.d || x.truque || ""), pg: parseInt(x.pg || x.pagina) || null}); }); } catch(e) {} }
  if (!out.length) txt.split("\n").forEach(l => { const p = l.split(/\s*\|\|\s*|\s+\|\s+|\t/).map(s => s.replace(/^\s*(\d+[.)]|[-*•])\s*/, "").replace(/^(P|R|pergunta|resposta)\s*:\s*/i, "").trim());
    if (p.length >= 2 && p[0].length > 2 && p[1].length > 1) out.push({f: p[0], r: p[1], p: "", d: "", pg: parseInt(p[2]) || null}); });
  return out;
}
function otherAIGen(nb, d, a, b){
  const lab = d.kind === "pptx" ? "slide" : "página", P = cleanPages(d);
  let text = ""; for (let i = a; i <= b; i++) { const t = (P[i-1] || "").trim(); if (t) text += `[${lab.toUpperCase()} ${i}]\n${t}\n\n`; }
  text = text.slice(0, 24000);
  const prompt = `Cria flashcards de estudo em português de Portugal a partir do texto abaixo (slides de uma aula). Usa só a informação do texto; ignora capa, sumário, contactos e bibliografia. Uma ideia por cartão, pergunta clara, resposta completa mas curta; nas listas põe todos os itens.
Responde SÓ com um array JSON assim: [{"f":"pergunta","r":"resposta","p":"porquê/explicação simples","d":"truque para decorar ou vazio","pg":número da ${lab}}]

TEXTO:
${text}`;
  otherAIDialog("Criar flashcards com outra IA", prompt, {pasteLabel: "Criar flashcards", paste: txt => {
    const L = parseCards(txt); if (!L.length) return "Não encontrei flashcards na resposta. Cola a resposta completa (a lista que começa com «[»).";
    const known = new Set(nb.cards.map(c => plainTxt(c.f).toLowerCase())); let n = 0;
    L.forEach(x => { if (known.has(x.f.toLowerCase())) return; known.add(x.f.toLowerCase()); nb.cards.push({id: uid(), f: x.f, r: x.r, p: x.p, d: x.d, doc: d.id, pg: x.pg && x.pg >= a && x.pg <= b ? x.pg : a}); n++; });
    save(nb); render(); toast(n + " flashcards criados com a outra IA"); return true; }});
}

let GROUPS = [], GROUP = null, MSGS = [], GNBS = [], unsubG = [], gLoaded = false;
const gcode = () => Array.from({length: 6}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join("");
async function loadGroups(){
  if (!FB || !CAP.uid) return;
  try { const {FS, db} = FB; const s = await FS.getDocs(FS.query(FS.collection(db, "groups"), FS.where("members", "array-contains", CAP.uid)));
    GROUPS = s.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => (b.last || 0) - (a.last || 0)); gLoaded = true;
    if (route.v === "groups") render(); } catch(e) { console.error(e); }
}
function stopGroup(){ unsubG.forEach(f => { try { f(); } catch(e) {} }); unsubG = []; GROUP = null; MSGS = []; GNBS = []; }
function openGroup(id){
  stopGroup(); const {FS, db} = FB;
  unsubG.push(FS.onSnapshot(FS.doc(db, "groups/" + id), s => { if (!s.exists()) { toast("Este grupo já não existe."); stopGroup(); go({v: "groups"}); return; }
    GROUP = Object.assign({id}, s.data()); if (!GROUP.members.includes(CAP.uid)) { toast("Já não fazes parte deste grupo."); stopGroup(); loadGroups(); go({v: "groups"}); return; }
    if (route.v === "group") renderGroupKeep(); }, () => {}));
  unsubG.push(FS.onSnapshot(FS.query(FS.collection(db, "groups/" + id + "/msgs"), FS.orderBy("at", "desc"), FS.limit(200)), s => {
    MSGS = s.docs.map(d => Object.assign({id: d.id}, d.data())).reverse(); if (route.v === "group") renderChat(); }, () => {}));
  unsubG.push(FS.onSnapshot(FS.collection(db, "groups/" + id + "/cadernos"), s => {
    GNBS = s.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => (b.updated || 0) - (a.updated || 0)); if (route.v === "group") renderGroupKeep(); }, () => {}));
  route = {v: "group", id}; render();
}

function stem(w){ return w.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,6); }
function gradeLocal(c, ans){
  const stop = new Set(["que","para","como","com","uma","dos","das","nos","nas","por","mais","sao","pelo","pela","the","and","this","esta","este","isso","entre","sobre"]);
  const keys = [...new Set(plain(c.r).split(/\s+/).map(stem).filter(w => w.length >= 4 && !stop.has(w)))];
  const a = new Set(ans.split(/\s+/).map(stem)); const hit = keys.filter(k => a.has(k)).length; const n = keys.length ? Math.round(hit / keys.length * 100) : 0;
  return {n, v: n >= 60 ? "certo" : n >= 30 ? "quase" : "errado", c: n >= 60 ? "Tens as ideias principais." : n >= 30 ? "Estás no caminho, mas faltam ideias importantes." : "Ainda faltam as ideias principais. Lê a resposta e tenta de novo."};
}
async function grade(c, ans){
  if (!CAP.sample) return gradeLocal(c, ans);
  if (ACC_LIMIT) { const r = gradeLocal(c, ans); r.c = "Chegaste ao limite de IA de hoje; corrigi por palavras-chave. " + r.c; return r; }
  iaUse("corrigir");

    const j = await CAP.sample.json(`Corriges a resposta de um estudante a um flashcard. Usa APENAS a resposta oficial. Não penalizes erros ortográficos. Uma resposta curta com o essencial está certa. Se contradiz a resposta oficial, é erro.

Resposta do estudante: ${ans}
Responde só com JSON: {"nota": 0-100, "veredicto": "certo"|"quase"|"errado", "comentario": "1 ou 2 frases em português de Portugal, a falar com o estudante (tu)"}`, {modelTier: "quick"});
    return {n: Math.max(0, Math.min(100, +j.nota || 0)), v: ["certo","quase","errado"].includes(j.veredicto) ? j.veredicto : (j.nota >= 70 ? "certo" : j.nota >= 40 ? "quase" : "errado"), c: String(j.comentario || "")};
  } catch(e) { if (e && e.code === "rate_limited") accLimit(); const r = gradeLocal(c, ans); r.c = (e && e.code === "rate_limited" ? "Chegaste ao limite de IA de hoje; corrigi por palavras-chave. " : "A IA não respondeu agora; corrigi por palavras-chave. ") + r.c; return r; }

async function readFile(file){
  const name = file.name.replace(/\.[^.]+$/, ""), ext = (file.name.split(".").pop() || "").toLowerCase();
  if (ext === "pdf") {
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise; const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) { const t = await (await pdf.getPage(i)).getTextContent(); pages.push(t.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("").replace(/[ \t]+/g, " ").trim()); }
    return {name, kind: "pdf", pages};
  }
  if (ext === "pptx") {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const slides = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    const un = t => t.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
    const pages = []; for (const k of slides) { const x = await zip.file(k).async("string");
      const paras = x.match(/<a:p[ >][\s\S]*?<\/a:p>/g) || [];
      pages.push(paras.map(pp => un((pp.match(/<a:t>([^<]*)<\/a:t>/g) || []).map(t => t.replace(/<\/?a:t>/g, "")).join("")).trim()).filter(Boolean).join("\n")); }

// ----- partilhar
function tabShare(nb){
  const sh = nb.share || {}, on = !!sh.on, docs = (nb.docs || []).filter(d => d.pages);
  const stale = on && (nb.updated || 0) > (sh.at || 0) + 2000;
  const what = on ? [sh.cards ? `${nb.cards.length} flashcards` : "", sh.notes ? `${(nb.notes||[]).length} resumos` : "", (sh.docs||[]).length ? `${sh.docs.length} documento(s)` : ""].filter(Boolean).join(", ") : "";
  const com = nb.example ? `<p class="muted">O caderno de exemplo não pode ser partilhado.</p>`
    : !CAP.canShare ? `<p class="muted">${CAP.db ? "Entra na tua conta para partilhares na Biblioteca. Também podes enviar o ficheiro do caderno (em baixo)." : "Disponível quando entras na tua conta."}</p>`
    : `<div class="checks">
        <label><input type="checkbox" id="shC" ${(on ? sh.cards : true) ? "checked" : ""}> <span><b>Flashcards</b> (${nb.cards.length})</span></label>
        <label><input type="checkbox" id="shN" ${on && sh.notes ? "checked" : ""}> <span><b>Resumos</b> (${(nb.notes||[]).length})</span></label>
        ${docs.map(d => `<label><input type="checkbox" data-shd="${d.id}" ${on && (sh.docs||[]).includes(d.id) ? "checked" : ""}> <span><b>📄 ${esc(d.name)}</b> <span class="muted">(texto, ${d.pages.length} pág.)</span></span></label>`).join("")}
      </div>
      <label class="muted">Nome que aparece na Biblioteca <input type="text" id="shA" value="${esc(S.alias || "")}" maxlength="30" placeholder="Deixa vazio para aparecer «Anónimo»" style="width:100%"></label>
      <p class="muted">⚠️ Partilha só documentos que podes partilhar, como apontamentos teus. Slides e livros dos professores podem ter direitos de autor.</p>
      <div class="row"><button class="btn fill" id="shGo">${on ? "Atualizar partilha" : "👥 Partilhar o que escolhi"}</button>${on ? `<button class="btn danger" id="shOff">Deixar de partilhar</button>` : ""}</div>`;
  return `<div class="${on ? "lock pub" : "lock"}">${on ? "👥" : "🔒"} <span>${on ? `Estás a partilhar na Biblioteca: <b>${what}</b>.${stale ? " Mudaste o caderno depois disso: carrega em «Atualizar partilha» para os colegas verem a versão nova." : ""} O teu progresso, as tuas datas e o que não escolheste continuam privados.` : "Este caderno é privado: só tu o vês. Nada é partilhado sem escolheres."}</span></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>👥 Partilhar com a comunidade</h3><p class="muted" style="margin:0">Escolhe o que os colegas podem ver na 📚 Biblioteca e copiar para eles.</p>${com}</div>
    <div class="panel"><h3>Enviar este caderno a alguém</h3><p class="muted">Guarda um ficheiro com os flashcards, resumos e documentos (sem o teu progresso). A outra pessoa abre o site e carrega em «⬆ Importar caderno».</p>
      <button class="btn fill" id="exp" ${CAP.dl ? "" : "disabled"}>⬇ Guardar ficheiro do caderno</button>${CAP.dl ? "" : `<p class="muted">Disponível quando entras na tua conta.</p>`}</div>
    ${CAP.owner ? `<div class="panel"><h3>⭐ Escolhas do site</h3><p class="muted">Só tu (dona do site) vês isto. Publica uma cópia em destaque na Biblioteca. O teu progresso não vai.</p><button class="btn pri" id="pub">⭐ Publicar em destaque</button></div>` : ""}`;
}
function wireShare(nb){
  const go = $("#shGo"); if (go) go.onclick = async () => {
    const opt = {cards: $("#shC").checked, notes: $("#shN").checked, docs: [...document.querySelectorAll("[data-shd]")].filter(x => x.checked).map(x => x.dataset.shd)};
    if (!opt.cards && !opt.notes && !opt.docs.length) return toast("Escolhe pelo menos uma coisa para partilhar.");
    S.alias = $("#shA").value.trim().slice(0, 30); S.metaUpdated = Date.now();
    go.disabled = true; go.textContent = "A partilhar…";
    try { await shareNb(nb, opt); toast("Partilhado na Biblioteca"); }
    catch(err) { toast(err && err.code === "invalid_argument" ? "Não tens permissão para partilhar neste Estuda Sem Stress." : "Não foi possível partilhar agora."); }
    render(); };
  const off = $("#shOff"); if (off) off.onclick = async () => { if (!off.dataset.sure) { off.dataset.sure = 1; off.textContent = "Carrega outra vez para confirmar"; return; }
    off.disabled = true; try { await unshareNb(nb); toast("Já não está partilhado"); } catch(err) { toast("Não foi possível agora."); } render(); };
  const e = $("#exp"); if (e) e.onclick = async () => { const data = JSON.parse(JSON.stringify(nb)); data.prog = {}; data.log = {}; delete data.goal; delete data.synced;
    try { await CAP.dl.save({filename: nb.name.replace(/[^\p{L}\p{N} _-]/gu, "").trim() + ".estojo.json", data: JSON.stringify({estojo: 1, nb: data})}); toast("Ficheiro guardado"); } catch(err) { if (err && err.code !== "cancelled") toast("Não foi possível guardar o ficheiro."); } };
  const p = $("#pub"); if (p) p.onclick = async () => { p.disabled = true; p.textContent = "A publicar…"; try { await publish(nb); } catch(err) { toast("Não foi possível publicar."); } p.disabled = false; p.textContent = "⭐ Publicar em destaque"; };
}
function importDialog(){
  dialog(`<h3>⬆ Importar caderno</h3><p class="muted">Escolhe um ficheiro .estojo.json que alguém te enviou.</p><label class="btn fill">Escolher ficheiro<input type="file" id="if" accept=".json" hidden></label><div class="row"><span class="grow"></span><button class="btn" id="cx">Fechar</button></div>`, (d, close) => {
    d.querySelector("#cx").onclick = close;
    d.querySelector("#if").onchange = async ev => { try { const j = JSON.parse(await ev.target.files[0].text()); const nb = j.nb; if (!nb || !Array.isArray(nb.cards)) throw 0;
        addCopy(nb); close(); } catch(e) { toast("Este ficheiro não é um caderno do site."); } };
  });
}
function addCopy(src){
  let f = S.folders.find(x => x.name === "Recebidos"); if (!f) { f = {id: uid(), name: "Recebidos", color: 4}; S.folders.push(f); S.metaUpdated = Date.now(); }
  const docMap = {}; const docs = (src.docs||[]).map(d => { const id = uid(); docMap[d.id] = id; return Object.assign({}, d, {id, synced: 0}); });
  const nb = {id: uid(), folder: f.id, name: src.name, color: src.color || 0, created: Date.now(), exams: src.exams || [], docs,
    cards: (src.cards||[]).map(c => Object.assign({}, c, {id: uid(), f: sanitize(c.f), r: sanitize(c.r), p: sanitize(c.p||""), doc: docMap[c.doc] || "", src: c.src || ""})),
    notes: (src.notes||[]).map(n => ({id: uid(), title: n.title, html: sanitize(n.html)})), prog: {}, log: {}};
  const strs = a => Array.isArray(a) ? a.map(x => String(x == null ? "" : x).slice(0, 2000)) : null;
  if (Array.isArray(src.mods)) nb.mods = strs(src.mods).slice(0, 60);
  if (Array.isArray(src.trk)) nb.trk = src.trk.slice(0, 60).map(strs);
  if (Array.isArray(src.glo)) nb.glo = src.glo.slice(0, 2000).filter(e => e && e.t).map(e => ({t: String(e.t).slice(0, 200), d: String(e.d || "").slice(0, 1000), r: String(e.r || "").slice(0, 200)}));
  if (Array.isArray(src.mc)) nb.mc = src.mc.slice(0, 60).filter(x => Array.isArray(x) && x.every(y => /^#?[0-9a-f]{6}$/i.test(y))).map(x => x.map(String));
  if (Array.isArray(src.cases)) nb.cases = src.cases.slice(0, 100).filter(x => x && Array.isArray(x.s)).map(x => ({t: String(x.t||""), q: String(x.q||""), ref: String(x.ref||""), w: String(x.w||""), s: strs(x.s)}));
  if (src.subject) nb.subject = String(src.subject).slice(0, 80);
  nb.cards.forEach(c => { c.m = Number.isInteger(c.m) ? c.m : undefined; ["num","th","x","n","pt","src","d"].forEach(k => { if (c[k] != null) c[k] = String(c[k]).slice(0, 4000); }); });
  S.notebooks.push(nb); save(nb); toast("Caderno copiado para «Recebidos»"); go({v: "nb", id: nb.id, tab: "study"});
}

// ----- biblioteca
let libQ = "";
function viewLib(){
  const q = libQ.toLowerCase(), m = x => !q || String(x.name).toLowerCase().includes(q) || String(x.alias||"").toLowerCase().includes(q);
  const L = LIB.filter(m), C = COMM.filter(m);
  const comTile = (c, k) => { const bits = [c.n ? c.n + " flashcards" : "", c.notes ? c.notes + " resumos" : "", (c.docs||[]).length ? c.docs.length + " doc." : ""].filter(Boolean).join(" · ");
    return `<div style="display:flex;flex-direction:column;gap:4px"><button class="nb" data-com="${k}" style="background:${PAL[(+c.color||0)%PAL.length][0]};width:100%"><b>${esc(c.name)}</b><span>${esc(bits)}</span><span class="by">por ${esc(c.alias || "Anónimo")}${c.who === CAP.uid ? " (tu)" : ""}</span><span style="margin-top:auto">⬇ Copiar para os meus cadernos</span></button>
      ${CAP.owner && c.who !== CAP.uid ? `<button class="btn sm danger" data-comdel="${k}">Remover da Biblioteca</button>` : ""}</div>`; };
  return `<div class="hero"><h1>Biblioteca</h1><p>Cadernos que os colegas escolheram partilhar. Copia um para os teus cadernos e estuda com o teu próprio progresso.</p></div>
    ${!CAP.db ? `<p class="muted">A ligar à Biblioteca…</p>` : `
    <div class="row"><input type="search" id="lq" class="grow" placeholder="Procurar por disciplina ou nome…" value="${esc(libQ)}" aria-label="Procurar na Biblioteca"><button class="btn" id="impB">⬆ Importar ficheiro</button></div>
    ${L.length ? `<section class="fold"><header><h2>⭐ Escolhas do site</h2></header><div class="shelf">${L.map(l => `<button class="nb" data-lib="${l.id}" style="background:${PAL[(l.color||0)%PAL.length][0]}"><b>${esc(l.name)}</b><span>${l.n} flashcards${(l.notes||[]).length?" · "+l.notes.length+" resumos":""}</span><span style="margin-top:auto">⬇ Copiar para os meus cadernos</span></button>`).join("")}</div></section>` : ""}
    <section class="fold"><header><h2>👥 Partilhado pela comunidade</h2></header>${C.length ? `<div class="shelf">${C.map(c => comTile(c, COMM.indexOf(c))).join("")}</div>` : `<p class="muted">${q ? "Nada encontrado." : "Ainda ninguém partilhou. Sê a primeira pessoa: abre um caderno e vai a «🔗 Partilhar»."}</p>`}</section>`}`;
}
function wireLib(){
  const lq = $("#lq"); if (lq) lq.oninput = () => { libQ = lq.value; const pos = lq.selectionStart; render(); const n = $("#lq"); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-lib]").forEach(b => b.onclick = async () => { b.disabled = true; b.querySelector("span:last-child").textContent = "A copiar…";
    try { addCopy(await libGet(b.dataset.lib)); } catch(e) { toast("Não foi possível copiar agora."); b.disabled = false; } });
  document.querySelectorAll("[data-com]").forEach(b => b.onclick = async () => { const it = COMM[+b.dataset.com]; if (!it) return; b.disabled = true; b.querySelector("span:last-child").textContent = "A copiar…";
    try { addCopy(await comGet(it)); } catch(e) { toast("Não foi possível copiar agora."); b.disabled = false; } });
  document.querySelectorAll("[data-comdel]").forEach(b => b.onclick = async () => { const it = COMM[+b.dataset.comdel]; if (!it) return;
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Carrega outra vez para remover"; return; }
    b.disabled = true; try { await clearShared(it.who, it.id); await writeIndex(it.who, L => L.filter(x => x.id !== it.id)); toast("Removido da Biblioteca"); loadCommunity(); } catch(e) { toast("Não foi possível remover."); b.disabled = false; } });
}

// ---------- arranque
document.addEventListener("keydown", e => { if (route.v !== "nb" || route.tab !== "study" || !studyState || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable || $(".dialog")) return;
  if (e.key === " " && $("#card")) { e.preventDefault(); $("#card").click(); return; }
  if (e.key === "ArrowRight") $("#next") && !$("#next").disabled && $("#next").click(); else if (e.key === "ArrowLeft") $("#prev") && !$("#prev").disabled && $("#prev").click(); else if (e.key === "1") $("#bR") && $("#bR").click(); else if (e.key === "2") $("#bS") && $("#bS").click(); });
try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch(e) {}
render();
initCaps();
function firstTour(){ if (firstTour.done) return; firstTour.done = 1; let seen = null; try { seen = localStorage.getItem("estojo-tour"); } catch(e) {} if (!seen && route.v !== "login") setTimeout(() => { if (!$(".dialog")) tour(0); }, 400); }
</script>
</body>
