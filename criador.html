<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criador · Estuda Sem Stress</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cr:#F5ECD7;--ol:#4B4A2E;--tx:#33311F;--t2:#6B6650;--ac:#9A5B3D;--c1:#EBDFC2;--c2:#F1E8D2;--ln:#D9CFB4;--s:1}
*{box-sizing:border-box}body{margin:0;font-family:'Source Sans 3',sans-serif;background:#F6F3EA;color:var(--tx)}
header{padding:22px 20px 8px;text-align:center}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:var(--t2)}
.tabs{display:flex;gap:12px;justify-content:center;padding:12px;flex-wrap:wrap}
.tabs button{border:2px solid #999;background:#fff;border-radius:12px 12px 4px 4px;padding:14px 26px;font:700 16px 'Source Sans 3';cursor:pointer;min-width:200px}
.tabs button.on.resumo{background:#E6E6E6;border-color:#555;font-family:'Courier New',monospace}
.tabs button.on.pp{background:var(--c1);border-color:var(--ac);color:var(--ac)}
.ctl{max-width:820px;margin:0 auto;padding:10px 20px}
.dz{display:block;border:2px dashed #999;border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:#fff}
.dz.over{background:var(--c2);border-color:var(--ac)}.dz input{display:none}
textarea,.ctl input[type=text]{width:100%;margin-top:10px;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}
textarea{min-height:90px}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:12px 20px;font:700 15px 'Source Sans 3';cursor:pointer;background:var(--ol);color:#fff}
.btn.sec{background:#fff;color:var(--tx);border:1px solid #999}
#msg{max-width:820px;margin:8px auto;padding:0 20px;color:var(--ac);min-height:20px}
#out{max-width:1100px;margin:10px auto 40px;padding:0 12px}
.nav{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px}
/* RESUMO */
.doc{background:#fff;color:#000;font:13px/1.55 'Courier New',monospace;max-width:794px;margin:0 auto;padding:40px 46px;box-shadow:0 2px 12px #0002}
.doc h1{text-align:center;font-size:20px;margin:0 0 6px}.doc .cap{text-align:center;border-bottom:1px dashed #888;padding-bottom:14px;margin-bottom:14px}
.doc .cap p{margin:2px 0;font-size:11px;color:#444}
.doc h2{font-size:14px;margin:26px 0 8px;border-bottom:1px solid #000;padding-bottom:3px}.doc h4{font-size:12px;margin:16px 0 5px}
.cx{background:#F2F2F2;border:1px solid #BBB;padding:9px 12px;font-size:12px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}.doc td,.doc th{border:1px solid #BBB;padding:6px 8px;vertical-align:top}
.doc th{background:#D9D9D9;text-align:center}.doc .kv th{text-align:left;width:28%}
.doc figure{margin:12px 0;text-align:center}.doc figcaption{font-size:11px;color:#444}
.doc .img{position:static;width:60%;height:200px;margin:0 auto;background:#F2F2F2;border:1px solid #BBB}
/* POWERPOINT */
.wrap{display:none;width:calc(1440px*var(--s));height:calc(810px*var(--s));margin:0 auto;box-shadow:0 2px 14px #0003}.wrap.on{display:block}
.sl{width:1440px;height:810px;position:relative;overflow:hidden;background:var(--cr);padding:43px 75px;transform:scale(var(--s));transform-origin:0 0;font-size:20px;line-height:1.4}
.sl.dk{background:var(--ol);color:var(--cr)}
.sl h3{font:700 44px 'Cormorant Garamond',serif;margin:0}.sl h3:after{content:"";display:block;width:70px;height:3px;background:var(--ac);margin-top:10px}
.nm{position:absolute;right:81px;bottom:58px;font-size:16px;color:var(--t2)}.dk .nm{color:#C98A6B}
.at{position:absolute;left:75px;bottom:58px;max-width:960px;background:var(--ol);color:var(--cr);padding:14px 22px;font-size:18px}
.rw{display:flex;gap:50px;margin-top:36px}.tx{flex:1}.tx .b{margin-bottom:22px}.tx .b h6{margin:0 0 3px;color:var(--ac);font:700 15px 'Source Sans 3';letter-spacing:.08em;text-transform:uppercase}
.img{background:var(--c1);border:1px solid var(--ln);width:520px;height:470px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--t2);cursor:pointer;font-size:16px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:contain;filter:sepia(.45)}.img.r{position:absolute;right:75px;top:75px;width:460px;height:660px}
.cp{position:absolute;left:75px;top:115px;width:700px}.cp h1{font:700 68px/1.05 'Cormorant Garamond',serif;margin:0 0 30px}.cp em{color:var(--ac);font:italic 500 26px 'Cormorant Garamond'}
.dv{position:absolute;left:75px;top:200px;width:800px}.dv .big{font:700 150px/1 'Cormorant Garamond',serif;color:#C98A6B}.dv h2{font:700 60px 'Cormorant Garamond',serif;margin:0}.dv p{font:italic 500 28px 'Cormorant Garamond';margin:10px 0}
.g{display:grid;gap:22px;margin-top:36px}.cd{background:var(--c1);padding:20px 22px;border-radius:4px}.cd i{display:inline-block;background:var(--ol);color:var(--cr);width:34px;height:34px;border-radius:50%;text-align:center;line-height:34px;font-style:normal;margin-bottom:6px}
.cd h5{margin:0 0 6px;font:700 24px 'Cormorant Garamond',serif;color:var(--ac)}.cd p{margin:0;font-size:18px}
.vf{display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--ln);padding:9px 0;font-size:19px}.vf b{width:38px;height:38px;border-radius:50%;background:var(--ol);color:var(--cr);text-align:center;line-height:38px;flex:none}.vf b.f{background:var(--ac)}.vf small{color:var(--t2);margin-left:auto}
.q{font:italic 500 26px 'Cormorant Garamond',serif;color:var(--ac)}
@media print{header,.tabs,.ctl,#msg,.nav{display:none!important}body,#out{background:#fff;margin:0;padding:0}:root{--s:1!important}
.wrap{display:block!important;break-after:page;box-shadow:none;margin:0}.doc{box-shadow:none;padding:0;max-width:none}}
</style></head><body>
<header><h1>Criador de resumos e PowerPoints</h1><p>Larga o teu ficheiro e recebe o resultado no formato do Estuda Sem Stress</p></header>
<div class="tabs"><button id="t-resumo" class="resumo on" onclick="tab('resumo')">📁 Resumo</button><button id="t-pp" class="pp" onclick="tab('pp')">📁 PowerPoint</button></div>
<div class="ctl">
<label class="dz" id="dz">Larga aqui o teu ficheiro (.txt, .md, .pdf) ou clica<input type="file" id="f" accept=".txt,.md,.pdf"></label>
<div id="fn" style="font-size:14px;color:var(--t2);margin-top:6px"></div>
<textarea id="txt" placeholder="…ou cola aqui o texto da matéria"></textarea>
<input type="text" id="tema" placeholder="Tema (opcional), ex.: Sistema respiratório">
<div class="row"><button class="btn" onclick="gerar()">Gerar</button><button class="btn sec" onclick="exemplo()">Ver exemplo</button><button class="btn sec" onclick="window.print()">Guardar em PDF</button></div></div>
<div id="msg"></div><div class="nav" id="nav" style="display:none"><button class="btn sec" onclick="go(-1)">◀</button><span id="ct"></span><button class="btn sec" onclick="go(1)">▶</button></div>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* LIGAÇÃO À IA: põe aqui o endereço da IA do teu site.
   Recebe POST JSON {system, user} e deve devolver JSON {text:"..."} com a resposta da IA. */
const CONFIG={endpoint:"/.netlify/functions/gerar"};

const SYS={
resumo:`És o gerador de resumos do Estojo. Usa SÓ o material fornecido; não inventes. Português de Portugal, frases curtas e claras, termos-chave a **negrito**. Não copies manuais. Devolve APENAS JSON, sem texto extra, assim:
{"titulo":"TEMA EM MAIÚSCULAS","subtitulo":"GUIA DE ESTUDO · …","uc":"…","nota_origem":"…","seccoes":[{"numero":1,"titulo":"TÍTULO EM MAIÚSCULAS","blocos":[
{"bloco":"paragrafo","texto":"…"},{"bloco":"caixa_bullets","subtitulo":"1 · NOME","linhas":["…"]},
{"bloco":"tabela_chave_valor","linhas":[["Rótulo","Descrição"]]},{"bloco":"tabela","colunas":["A","B","C"],"linhas":[["…","…","…"]]},
{"bloco":"tabela_etapas","linhas":[[1,"Etapa","Descrição"]]},{"bloco":"imagem","legenda":"…"}]}]}
Ordem: visão geral (números-chave), funções/ideias (uma caixa_bullets por ideia), depois classificações em tabela, componentes em tabela_chave_valor, processos em tabela_etapas.`,
pp:`És o gerador de PowerPoints do Estojo. Usa SÓ o material fornecido; não inventes. Português de Portugal, texto claro, máximo ~60 palavras por diapositivo. Devolve APENAS JSON, sem texto extra:
{"titulo":"…","data_sala":"…","slides":[ … ]}
Layouts permitidos e campos:
capa{titulo,data_sala,temas[],autora}; indice{titulo,cartoes[{titulo,texto}],atencao}; divisoria{numero:"01",titulo,subtitulo};
texto_imagem{titulo,blocos[{rotulo,texto}],imagem{legenda},atencao}; colunas{titulo,cartoes[{titulo,linhas[]}]}; passos{titulo,cartoes[{titulo,texto}]};
cartoes{titulo,cartoes[{titulo,texto}],atencao}; resumo{titulo,cartoes[{titulo,texto}]}; verdadeiro_falso{titulo,itens[{afirmacao,valor:"V"|"F",palavra_chave}]};
identificar{titulo,imagem{legenda},itens[""]}; pergunta_aberta{titulo,enunciado,resposta,palavras_chave}; fecho{titulo:"Bom estudo.",subtitulo:"Tu consegues.",data_sala}.
Ordem: capa, indice, [divisoria + conteúdo + resumo] por cada parte, verdadeiro_falso, identificar, pergunta_aberta, fecho. A cada diapositivo de conteúdo junta, se fizer sentido, "atencao" (1 frase: o que costuma sair no teste).`};

const EX={resumo:{titulo:"SISTEMA RESPIRATÓRIO",subtitulo:"GUIA DE ESTUDO · VIAS AÉREAS E TROCAS GASOSAS",uc:"Anatomia e Fisiologia Humana",nota_origem:"Exemplo de formato. Texto e imagens mudam em cada pedido.",seccoes:[{numero:1,titulo:"FUNÇÕES",blocos:[{bloco:"paragrafo",texto:"O aparelho respiratório fornece **oxigénio** e remove **dióxido de carbono**."},{bloco:"caixa_bullets",subtitulo:"1 · TROCAS GASOSAS",linhas:["O₂ passa do ar para o sangue.","CO₂ passa do sangue para o ar."]},{bloco:"tabela",colunas:["Porção","Onde termina","Trocas?"],linhas:[["Condutora","Bronquíolos terminais","Não"],["Respiratória","Alvéolos","**Sim**"]]},{bloco:"imagem",legenda:"Clica na imagem para juntar um esquema"}]}]},
pp:{titulo:"Sistema respiratório",data_sala:"Exemplo",slides:[{layout:"capa",titulo:"Sistema respiratório",data_sala:"Exemplo de formato",temas:["Vias aéreas","Trocas gasosas"],autora:"Estuda Sem Stress"},{layout:"divisoria",numero:"01",titulo:"Vias aéreas",subtitulo:"Porção condutora"},{layout:"texto_imagem",titulo:"Faringe e laringe",blocos:[{rotulo:"Faringe",texto:"Comum aos aparelhos respiratório e digestivo."},{rotulo:"Laringe",texto:"Tem **9 cartilagens** e as cordas vocais."}],imagem:{legenda:"Esquema da laringe"},atencao:"A epiglote impede os alimentos de entrarem na laringe."},{layout:"verdadeiro_falso",titulo:"Treino de verdadeiro ou falso",itens:[{afirmacao:"A porção condutora faz trocas gasosas.",valor:"F",palavra_chave:"condutora"},{afirmacao:"Os alvéolos fazem parte da porção respiratória.",valor:"V",palavra_chave:""}]},{layout:"fecho",titulo:"Bom estudo.",subtitulo:"Tu consegues.",data_sala:"Exemplo"}]}};

const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=s=>e(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
let modo='resumo',cur=0,nsl=0;
function tab(x){modo=x;for(const k of['resumo','pp'])document.getElementById('t-'+k).classList.toggle('on',k==x);
 document.getElementById('txt').placeholder=x=='pp'?'…ou cola aqui o texto para o PowerPoint':'…ou cola aqui o texto para o resumo';}
function msg(t){document.getElementById('msg').textContent=t}
const dz=document.getElementById('dz'),fi=document.getElementById('f');
fi.onchange=()=>fi.files[0]&&ler(fi.files[0]);
dz.ondragover=ev=>{ev.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=ev=>{ev.preventDefault();dz.classList.remove('over');ev.dataTransfer.files[0]&&ler(ev.dataTransfer.files[0])};
async function ler(f){document.getElementById('fn').textContent='Ficheiro: '+f.name;let t='';
 try{if(/\.pdf$/i.test(f.name)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=p.numPages;i++){const c=await(await p.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}}
 else t=await f.text();document.getElementById('txt').value=t;msg('')}catch(x){msg('Não consegui ler o ficheiro. Cola o texto na caixa.')}}
async function gerar(){const t=document.getElementById('txt').value.trim();if(!t){msg('Larga um ficheiro ou cola o texto.');return}
 if(!CONFIG.endpoint){msg('Falta ligar a IA: põe o endereço em CONFIG.endpoint (início do script). Entretanto vê o exemplo.');return}
 msg('A criar…');const tema=document.getElementById('tema').value.trim();
 try{const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:SYS[modo],user:(tema?'Tema: '+tema+'\n\n':'')+'MATERIAL:\n'+t.slice(0,60000)})});
  const d=await r.json();const raw=(d.text||(d.content&&d.content[0]&&d.content[0].text)||'').replace(/```json|```/g,'').trim();
  render(JSON.parse(raw));msg('')}catch(x){msg('A IA não devolveu um resultado válido. Tenta outra vez.')}}
function exemplo(){render(EX[modo]);msg('')}
function pg(css){let s=document.getElementById('pg');if(!s){s=document.createElement('style');s.id='pg';document.head.appendChild(s)}s.textContent=css}
function render(d){modo=d.slides?'pp':'resumo';tab(modo);const o=document.getElementById('out');
 if(modo=='resumo'){o.innerHTML=rResumo(d);document.getElementById('nav').style.display='none';
  pg('@page{size:A4;margin:18mm 16mm 20mm;@bottom-left{content:"'+String(d.titulo).replace(/"/g,'')+'";font:9px monospace}@bottom-right{content:"PÁG. "counter(page)"/"counter(pages);font:9px monospace}}')}
 else{nsl=d.slides.length;o.innerHTML=d.slides.map((s,i)=>'<div class="wrap"><div class="sl'+(/divisoria|fecho/.test(s.layout)?' dk':'')+'" contenteditable="true" spellcheck="false">'+sl(s,i)+'</div></div>').join('');
  document.getElementById('nav').style.display='flex';pg('@page{size:1440px 810px;margin:0}');cur=0;go(0);fit()}}
function fit(){document.documentElement.style.setProperty('--s',Math.min(1,(document.getElementById('out').clientWidth-24)/1440))}
addEventListener('resize',()=>modo=='pp'&&fit());
function go(n){if(modo!='pp')return;cur=Math.max(0,Math.min(nsl-1,cur+n));document.querySelectorAll('.wrap').forEach((w,i)=>w.classList.toggle('on',i==cur));document.getElementById('ct').textContent=(cur+1)+' / '+nsl}
addEventListener('keydown',ev=>{if(ev.target.isContentEditable||ev.target.tagName=='TEXTAREA'||ev.target.tagName=='INPUT')return;if(ev.key=='ArrowRight')go(1);if(ev.key=='ArrowLeft')go(-1)});
function slot(im,c){return '<div class="img '+(c||'')+'" onclick="pick(this)">'+(im&&im.url?'<img src="'+e(im.url)+'">':'<span>＋ juntar imagem'+(im&&im.legenda?'<br><small>'+e(im.legenda)+'</small>':'')+'</span>')+'</div>'}
function pick(el){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const r=new FileReader();r.onload=()=>el.innerHTML='<img src="'+r.result+'">';r.readAsDataURL(i.files[0])};i.click()}
function bloco(b){const t=b.bloco;
 if(t=='paragrafo')return '<p>'+m(b.texto)+'</p>';
 if(t=='caixa_bullets')return(b.subtitulo?'<h4>'+e(b.subtitulo)+'</h4>':'')+'<div class="cx">'+(b.linhas||[]).map(l=>'- '+m(l)).join('<br>')+'</div>';
 if(t=='tabela_chave_valor')return '<table class="kv">'+(b.linhas||[]).map(r=>'<tr><th>'+m(r[0])+'</th><td>'+m(r[1])+'</td></tr>').join('')+'</table>';
 if(t=='tabela'||t=='tabela_etapas'){const c=b.colunas||['Nº','Etapa','Descrição'];return '<table><tr>'+c.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr>'+(b.linhas||[]).map(r=>'<tr>'+r.map(x=>'<td>'+m(x)+'</td>').join('')+'</tr>').join('')+'</table>'}
 if(t=='imagem')return '<figure>'+slot(b)+'<figcaption>'+e(b.legenda)+'</figcaption></figure>';return''}
function rResumo(d){return '<div class="doc"><div class="cap"><h1>'+e(d.titulo)+'</h1><p>'+e(d.subtitulo)+'</p><b>Unidade Curricular: '+e(d.uc)+'</b></div>'+(d.nota_origem?'<div class="cx">'+m(d.nota_origem)+'</div>':'')+
 (d.seccoes||[]).map(s=>'<h2>'+s.numero+'. '+e(s.titulo)+'</h2>'+(s.blocos||[]).map(bloco).join('')).join('')+'</div>'}
function cards(a,cols){return '<div class="g" style="grid-template-columns:repeat('+cols+',1fr)">'+a.map((c,i)=>'<div class="cd"><i>'+(i+1)+'</i><h5>'+m(c.titulo||c.nome||c.rotulo)+'</h5><p>'+m(c.texto||c.detalhe||'')+(c.linhas||[]).map(l=>'<br>• '+m(l)).join('')+'</p></div>').join('')+'</div>'}
function sl(s,i){const L=s.layout,T='<h3>'+m(s.titulo)+'</h3>',nm='<span class="nm">'+String(i+1).padStart(2,'0')+'</span>',at=s.atencao?'<div class="at"><b>Atenção no teste</b> · '+m(s.atencao)+'</div>':'',cs=s.cartoes||[];let b='';
 if(L=='capa')return '<div class="cp"><h1>'+m(s.titulo)+'</h1><p><b>'+e(s.data_sala)+'</b></p><p>'+e((s.temas||[]).join(' · '))+'</p><em>'+e(s.autora)+'</em></div>'+slot(s.imagem,'r');
 if(L=='divisoria'||L=='fecho')return '<div class="dv"><div class="big">'+e(s.numero||'')+'</div><h2>'+m(s.titulo)+'</h2><p>'+m(s.subtitulo)+'</p>'+(L=='fecho'?'<p style="font-size:20px">'+e(s.data_sala)+'</p>':'')+'</div>'+(L=='fecho'?slot(s.imagem,'r'):nm);
 if(L=='texto_imagem')b='<div class="rw"><div class="tx">'+(s.blocos||[]).map(x=>'<div class="b"><h6>'+m(x.rotulo)+'</h6>'+m(x.texto)+'</div>').join('')+'</div>'+slot(s.imagem)+'</div>';
 else if(L=='identificar')b='<div class="rw">'+slot(s.imagem)+'<div class="tx">'+(s.itens||[]).map((x,k)=>'<div class="b"><b style="color:var(--ac)">'+(k+1)+'</b> '+m(x)+'</div>').join('')+'</div></div>';
 else if(L=='verdadeiro_falso')b='<div style="margin-top:26px">'+(s.itens||[]).map(x=>'<div class="vf"><span>'+m(x.afirmacao)+'</span><small>'+m(x.palavra_chave)+'</small><b class="'+(x.valor=='F'?'f':'')+'">'+e(x.valor)+'</b></div>').join('')+'</div>';
 else if(L=='pergunta_aberta')b='<div class="rw"><div class="tx"><p class="q">'+m(s.enunciado)+'</p><p>'+m(s.resposta)+'</p></div><div class="cd" style="width:380px;height:fit-content"><h5>Palavras-chave</h5><p>'+m(s.palavras_chave)+'</p></div></div>';
 else b=cards(cs,Math.min(L=='colunas'?2:L=='indice'?4:3,Math.max(1,cs.length)));
 return T+b+at+nm}
</script></body></html>
